<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="proj-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0E1219" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="card-proj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#212A38" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#151C26" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="tag-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="tag-mint-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="proj-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .proj-title { font-size: 16px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.3px; }
    .proj-desc { font-size: 12px; fill: #94A3B8; line-height: 1.5; }
    .proj-badge { font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .tech-pill { font-size: 10px; font-weight: 600; fill: #CBD5E1; }
    .btn-link { font-size: 11px; font-weight: 600; fill: #38BDF8; }
  </style>

  <g filter="url(#proj-shadow)">
    <!-- Container Box -->
    <rect x="0" y="0" width="940" height="480" rx="24" fill="url(#proj-bg)" stroke="#273244" stroke-width="1.2" />

    <!-- Top Header -->
    <g transform="translate(32, 28)">
      <circle cx="6" cy="6" r="3.5" fill="#10B981" />
      <text x="18" y="10" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">FEATURED SYSTEMS &amp; PRODUCTION PROJECTS</text>
      <text x="18" y="26" font-size="11.5" fill="#64748B">Flagship software repositories showcasing deep learning inference, graph traversal, and spatial analytics.</text>
    </g>

    <!-- 2x2 Bento Grid of Projects -->

    <!-- ================= CARD 1: YOLOv10 Weapon Detection ================= -->
    <g transform="translate(32, 74)">
      <rect x="0" y="0" width="428" height="178" rx="16" fill="url(#card-proj)" stroke="#2E3A4D" stroke-width="1" />
      
      <!-- Top Tag Bar -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="156" height="20" rx="10" fill="#082F49" stroke="#0284C7" stroke-width="0.8" />
        <circle cx="10" cy="10" r="3" fill="#38BDF8" />
        <text x="18" y="14" class="proj-badge" fill="#38BDF8">COMPUTER VISION // AI</text>

        <!-- Project number badge -->
        <rect x="364" y="0" width="28" height="20" rx="10" fill="#111620" stroke="#1E293B" stroke-width="0.8" />
        <text x="378" y="14" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">#01</text>
      </g>

      <!-- Title -->
      <text x="18" y="64" class="proj-title">Gun Detection with YOLOv10</text>
      
      <!-- Description -->
      <text x="18" y="86" class="proj-desc">End-to-end real-time deep learning pipeline trained to localize</text>
      <text x="18" y="102" class="proj-desc">firearms with bounding-box regression and low-latency inference.</text>

      <!-- Stack Pills -->
      <g transform="translate(18, 120)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="30" y="15" class="tech-pill" text-anchor="middle">Python</text>

        <rect x="68" y="0" width="70" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="103" y="15" class="tech-pill" text-anchor="middle">YOLOv10</text>

        <rect x="146" y="0" width="66" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="179" y="15" class="tech-pill" text-anchor="middle">PyTorch</text>

        <rect x="220" y="0" width="64" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="252" y="15" class="tech-pill" text-anchor="middle">OpenCV</text>
      </g>

      <!-- Action Link text -->
      <text x="18" y="162" class="btn-link">View GitHub Repository → Tasrif-Ahmed-Mohsin/Gun-detection-with-yolov10</text>
    </g>

    <!-- ================= CARD 2: Restaurant Saga ================= -->
    <g transform="translate(480, 74)">
      <rect x="0" y="0" width="428" height="178" rx="16" fill="url(#card-proj)" stroke="#2E3A4D" stroke-width="1" />
      
      <!-- Top Tag Bar -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="168" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="0.8" />
        <circle cx="10" cy="10" r="3" fill="#34D399" />
        <text x="18" y="14" class="proj-badge" fill="#34D399">ML // SPATIAL ANALYTICS</text>

        <rect x="364" y="0" width="28" height="20" rx="10" fill="#111620" stroke="#1E293B" stroke-width="0.8" />
        <text x="378" y="14" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">#02</text>
      </g>

      <!-- Title -->
      <text x="18" y="64" class="proj-title">Restaurant Success Predictor</text>
      
      <!-- Description -->
      <text x="18" y="86" class="proj-desc">Predictive machine learning platform estimating culinary venture</text>
      <text x="18" y="102" class="proj-desc">viability across Dhaka with dynamic geospatial heatmaps.</text>

      <!-- Stack Pills -->
      <g transform="translate(18, 120)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="30" y="15" class="tech-pill" text-anchor="middle">Python</text>

        <rect x="68" y="0" width="72" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="104" y="15" class="tech-pill" text-anchor="middle">Streamlit</text>

        <rect x="148" y="0" width="80" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="188" y="15" class="tech-pill" text-anchor="middle">scikit-learn</text>

        <rect x="236" y="0" width="58" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="265" y="15" class="tech-pill" text-anchor="middle">Folium</text>
      </g>

      <text x="18" y="162" class="btn-link">View GitHub Repository → Tasrif-Ahmed-Mohsin/Restaurant-Saga</text>
    </g>

    <!-- ================= CARD 3: Way-to-BRAC Pathfinder ================= -->
    <g transform="translate(32, 268)">
      <rect x="0" y="0" width="428" height="178" rx="16" fill="url(#card-proj)" stroke="#2E3A4D" stroke-width="1" />
      
      <!-- Top Tag Bar -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="176" height="20" rx="10" fill="#3B0764" stroke="#7E22CE" stroke-width="0.8" />
        <circle cx="10" cy="10" r="3" fill="#C084FC" />
        <text x="18" y="14" class="proj-badge" fill="#C084FC">GRAPH ALGORITHMS // DSA</text>

        <rect x="364" y="0" width="28" height="20" rx="10" fill="#111620" stroke="#1E293B" stroke-width="0.8" />
        <text x="378" y="14" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">#03</text>
      </g>

      <!-- Title -->
      <text x="18" y="64" class="proj-title">Way-to-BRAC · Multimodal Pathfinder</text>
      
      <!-- Description -->
      <text x="18" y="86" class="proj-desc">Desktop routing system utilizing DFS graph traversal to compute</text>
      <text x="18" y="102" class="proj-desc">and rank transit paths to BRAC University by transport mode.</text>

      <!-- Stack Pills -->
      <g transform="translate(18, 120)">
        <rect x="0" y="0" width="52" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="26" y="15" class="tech-pill" text-anchor="middle">Java</text>

        <rect x="60" y="0" width="76" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="98" y="15" class="tech-pill" text-anchor="middle">Swing GUI</text>

        <rect x="144" y="0" width="82" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="185" y="15" class="tech-pill" text-anchor="middle">Graph DFS</text>

        <rect x="234" y="0" width="84" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="276" y="15" class="tech-pill" text-anchor="middle">Transit Rank</text>
      </g>

      <text x="18" y="162" class="btn-link">View GitHub Repository → Tasrif-Ahmed-Mohsin/Way-to-BRAC</text>
    </g>

    <!-- ================= CARD 4: Robo-Pekka ================= -->
    <g transform="translate(480, 268)">
      <rect x="0" y="0" width="428" height="178" rx="16" fill="url(#card-proj)" stroke="#2E3A4D" stroke-width="1" />
      
      <!-- Top Tag Bar -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="168" height="20" rx="10" fill="#4C0519" stroke="#BE123C" stroke-width="0.8" />
        <circle cx="10" cy="10" r="3" fill="#FB7185" />
        <text x="18" y="14" class="proj-badge" fill="#FB7185">ROBOTICS // EMBEDDED C++</text>

        <rect x="364" y="0" width="28" height="20" rx="10" fill="#111620" stroke="#1E293B" stroke-width="0.8" />
        <text x="378" y="14" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">#04</text>
      </g>

      <!-- Title -->
      <text x="18" y="64" class="proj-title">Robo-Pekka Autonomous Engine</text>
      
      <!-- Description -->
      <text x="18" y="86" class="proj-desc">Embedded robotics software implementing deterministic finite</text>
      <text x="18" y="102" class="proj-desc">state machines, sensor telemetry, and low-latency motor control.</text>

      <!-- Stack Pills -->
      <g transform="translate(18, 120)">
        <rect x="0" y="0" width="52" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="26" y="15" class="tech-pill" text-anchor="middle">C++</text>

        <rect x="60" y="0" width="70" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="95" y="15" class="tech-pill" text-anchor="middle">Robotics</text>

        <rect x="138" y="0" width="96" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="186" y="15" class="tech-pill" text-anchor="middle">State Machine</text>

        <rect x="242" y="0" width="78" height="22" rx="6" fill="#131924" stroke="#1F2937" stroke-width="0.8" />
        <text x="281" y="15" class="tech-pill" text-anchor="middle">Embedded</text>
      </g>

      <text x="18" y="162" class="btn-link">View GitHub Repository → Tasrif-Ahmed-Mohsin/Robo-Pekka</text>
    </g>

  </g>
</svg>