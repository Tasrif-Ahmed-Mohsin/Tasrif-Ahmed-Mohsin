<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="neu-extruded-p" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="1" />
      <feDropShadow dx="14" dy="14" stdDeviation="18" flood-color="#B8C4D4" flood-opacity="0.55" />
    </filter>

    <filter id="neu-btn-p" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="1" />
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#B8C4D4" flood-opacity="0.5" />
    </filter>

    <linearGradient id="inset-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5DFEC" />
      <stop offset="35%" stop-color="#E2EBF5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="card-surface-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F6FB" />
      <stop offset="100%" stop-color="#E5ECF4" />
    </linearGradient>

    <linearGradient id="bg-canvas-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8EEF5" />
      <stop offset="100%" stop-color="#DFE7F0" />
    </linearGradient>
  </defs>

  <style>
    .header-title { font-size: 20px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
    .item-title { font-size: 14px; font-weight: 700; fill: #1E293B; }
    .item-sub { font-size: 11px; fill: #64748B; }
    .badge-pill { font-size: 9.5px; font-weight: 800; fill: #475569; }
  </style>

  <rect x="0" y="0" width="680" height="540" rx="40" fill="url(#bg-canvas-p)" />

  <g transform="translate(48, 40)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="584" height="460" rx="44" fill="url(#card-surface-p)" filter="url(#neu-extruded-p)" />

    <!-- Header Row -->
    <g transform="translate(36, 36)">
      <text x="0" y="0" class="header-title">SYSTEM REPOSITORIES</text>
      <text x="0" y="18" font-size="11" font-weight="600" fill="#78889B">Flagship Deep Learning &amp; Algorithmic Builds</text>
    </g>

    <!-- 4 Inset Wells for the Projects -->
    
    <!-- Item 1: Gun Detection YOLOv10 -->
    <g transform="translate(36, 78)">
      <rect x="0" y="0" width="512" height="74" rx="20" fill="url(#inset-p)" />
      <rect x="0" y="0" width="512" height="74" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

      <!-- Content -->
      <g transform="translate(20, 26)">
        <text x="0" y="0" class="item-title">Gun Detection with YOLOv10</text>
        <text x="0" y="18" class="item-sub">Real-time firearm localization &amp; deep learning inference · PyTorch / OpenCV</text>
      </g>
      
      <!-- Right Action Pill -->
      <g transform="translate(434, 18)">
        <rect x="0" y="0" width="58" height="38" rx="14" fill="#EBF1F8" filter="url(#neu-btn-p)" />
        <text x="29" y="24" class="badge-pill" text-anchor="middle">REPO ↗</text>
      </g>
    </g>

    <!-- Item 2: Restaurant Success Predictor -->
    <g transform="translate(36, 166)">
      <rect x="0" y="0" width="512" height="74" rx="20" fill="url(#inset-p)" />
      <rect x="0" y="0" width="512" height="74" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

      <g transform="translate(20, 26)">
        <text x="0" y="0" class="item-title">Restaurant Success Predictor</text>
        <text x="0" y="18" class="item-sub">Urban economic feasibility ML model &amp; spatial heatmap · Streamlit / Folium</text>
      </g>

      <g transform="translate(434, 18)">
        <rect x="0" y="0" width="58" height="38" rx="14" fill="#EBF1F8" filter="url(#neu-btn-p)" />
        <text x="29" y="24" class="badge-pill" text-anchor="middle">REPO ↗</text>
      </g>
    </g>

    <!-- Item 3: Way-to-BRAC Pathfinder -->
    <g transform="translate(36, 254)">
      <rect x="0" y="0" width="512" height="74" rx="20" fill="url(#inset-p)" />
      <rect x="0" y="0" width="512" height="74" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

      <g transform="translate(20, 26)">
        <text x="0" y="0" class="item-title">Way-to-BRAC Pathfinder</text>
        <text x="0" y="18" class="item-sub">Multimodal transit optimization using graph traversal (DFS) · Java Swing</text>
      </g>

      <g transform="translate(434, 18)">
        <rect x="0" y="0" width="58" height="38" rx="14" fill="#EBF1F8" filter="url(#neu-btn-p)" />
        <text x="29" y="24" class="badge-pill" text-anchor="middle">REPO ↗</text>
      </g>
    </g>

    <!-- Item 4: Robo-Pekka Robotics -->
    <g transform="translate(36, 342)">
      <rect x="0" y="0" width="512" height="74" rx="20" fill="url(#inset-p)" />
      <rect x="0" y="0" width="512" height="74" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

      <g transform="translate(20, 26)">
        <text x="0" y="0" class="item-title">Robo-Pekka Autonomous Engine</text>
        <text x="0" y="18" class="item-sub">Deterministic C++ finite state machine with sensor telemetry · Embedded</text>
      </g>

      <g transform="translate(434, 18)">
        <rect x="0" y="0" width="58" height="38" rx="14" fill="#EBF1F8" filter="url(#neu-btn-p)" />
        <text x="29" y="24" class="badge-pill" text-anchor="middle">REPO ↗</text>
      </g>
    </g>

  </g>
</svg>