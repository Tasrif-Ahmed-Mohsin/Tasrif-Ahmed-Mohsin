<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Mathematical Seigaiha Concentric Japanese Wave Vector Pattern -->
    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 A 20 20 0 0 1 40 20 M 5 20 A 15 15 0 0 1 35 20 M 10 20 A 10 10 0 0 1 30 20 M 15 20 A 5 5 0 0 1 25 20 M -20 10 A 20 20 0 0 1 20 10 M -15 10 A 15 15 0 0 1 15 10 M -10 10 A 10 10 0 0 1 10 10 M -5 10 A 5 5 0 0 1 5 10 M 20 10 A 20 20 0 0 1 60 10 M 25 10 A 15 15 0 0 1 55 10 M 30 10 A 10 10 0 0 1 50 10 M 35 10 A 5 5 0 0 1 45 10 M 0 0 A 20 20 0 0 1 40 0 M 5 0 A 15 15 0 0 1 35 0 M 10 0 A 10 10 0 0 1 30 0 M 15 0 A 5 5 0 0 1 25 0" fill="none" class="wave-stroke" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    /* Default / Light Mode */
    .card-bg { fill: rgba(248, 250, 252, 0.6); stroke: #CBD5E1; }
    .card-inner { fill: rgba(241, 245, 249, 0.7); stroke: #E2E8F0; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0F172A; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; fill: #475569; }
    .meta { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-weight: 600; fill: #2563EB; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; fill: #475569; }
    .pill-bg { fill: rgba(15, 23, 42, 0.04); stroke: #CBD5E1; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; fill: #334155; }
    .icon { stroke: #2563EB; }
    .wave-stroke { stroke: #2563EB; opacity: 0.14; }
    .wave-art { fill: #2563EB; opacity: 0.07; }
    .wave-foam { stroke: #2563EB; opacity: 0.25; }

    /* GitHub Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: rgba(22, 27, 34, 0.65); stroke: #30363D; }
      .card-inner { fill: rgba(13, 17, 23, 0.75); stroke: #21262D; }
      .title { fill: #F0F6FC; }
      .sub { fill: #8B949E; }
      .meta { fill: #58A6FF; }
      .desc { fill: #8B949E; }
      .pill-bg { fill: rgba(240, 246, 252, 0.06); stroke: #30363D; }
      .pill-txt { fill: #C9D1D9; }
      .icon { stroke: #58A6FF; }
      .wave-stroke { stroke: #58A6FF; opacity: 0.16; }
      .wave-art { fill: #58A6FF; opacity: 0.08; }
      .wave-foam { stroke: #58A6FF; opacity: 0.35; }
    }
  </style>

  <rect x="1" y="1" width="328" height="122" rx="8" class="card-bg" stroke-width="1" />
  <rect x="2" y="2" width="326" height="120" rx="8" fill="url(#seigaiha)" />

  <g transform="translate(18, 15)">
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0)">
  <polygon points="7 1 1.5 4.5 7 8 12.5 4.5 7 1" class="icon" stroke-width="1.2" fill="none"/>
  <polyline points="1.5 7.5 7 11 12.5 7.5" class="icon" stroke-width="1.2" fill="none"/>
  <polyline points="1.5 10.5 7 14 12.5 10.5" class="icon" stroke-width="1.2" fill="none"/>
</g>
      <text x="22" y="11" font-size="9" class="meta" letter-spacing="1">DIRECTORY // GITHUB</text>
      <text x="294" y="11" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" class="meta" text-anchor="end">↗</text>
    </g>

    <text x="0" y="32" font-size="13" class="title">All Public Repositories</text>

    <text x="0" y="48" font-size="10" class="desc">Explore open-source algorithmic tools, academic research</text>
    <text x="0" y="62" font-size="10" class="desc">experiments, and system software builds on GitHub.</text>

    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="130" height="18" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="65" y="12.5" font-size="8.5" class="title" text-anchor="middle">View Full Archive →</text>
    </g>
  </g>
</svg>