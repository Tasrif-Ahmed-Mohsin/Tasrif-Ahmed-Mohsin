<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="va-clip">
      <rect width="330" height="124" rx="8" />
    </clipPath>
    <linearGradient id="va-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102034" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1B304D" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #97BDE4; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #F4F8FD; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #B4CEE8; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 700; fill: #EEF5FC; }
  </style>

  <g clip-path="url(#va-clip)">
    <image href="data:image/jpeg;base64," width="330" height="124" preserveAspectRatio="xMidYMid slice" />
    <rect width="330" height="124" fill="url(#va-overlay)" />
    <rect x="0.5" y="0.5" width="329" height="123" rx="8" fill="none" stroke="#355782" stroke-width="1.1" />

    <g transform="translate(18, 15)">
      <g transform="translate(0, 0)">
        <g transform="translate(0, 0)">
  <polygon points="7 1 1.5 4.5 7 8 12.5 4.5 7 1" stroke="#7AA4D4" stroke-width="1.2" fill="none"/>
  <polyline points="1.5 7.5 7 11 12.5 7.5" stroke="#7AA4D4" stroke-width="1.2" fill="none"/>
  <polyline points="1.5 10.5 7 14 12.5 10.5" stroke="#7AA4D4" stroke-width="1.2" fill="none"/>
</g>
        <text x="22" y="11" class="idx">DIRECTORY // GITHUB</text>
        <text x="294" y="11" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ADCDEE" text-anchor="end">↗</text>
      </g>

      <text x="0" y="32" class="name">All Public Repositories</text>

      <text x="0" y="48" class="desc">Explore open-source algorithmic tools, academic research</text>
      <text x="0" y="62" class="desc">experiments, and system software builds on GitHub.</text>

      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="130" height="18" rx="4" fill="#0C1726" stroke="#365780" stroke-width="0.8" />
        <text x="65" y="12.5" class="pill" text-anchor="middle">View Full Archive →</text>
      </g>
    </g>
  </g>
</svg>