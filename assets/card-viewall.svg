<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="va-clip">
      <rect width="330" height="124" rx="14" />
    </clipPath>
    <linearGradient id="va-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26283C" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#32354F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #A4A9D6; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #F4F6FC; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #B8BCD9; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 700; fill: #EFF1FB; }
  </style>

  <g clip-path="url(#va-clip)">
    <image href="data:image/jpeg;base64," width="330" height="124" preserveAspectRatio="xMidYMid slice" />
    <rect width="330" height="124" fill="url(#va-overlay)" />
    <rect x="0.5" y="0.5" width="329" height="123" rx="14" fill="none" stroke="#5E638E" stroke-width="1.1" />

    <g transform="translate(18, 16)">
      <text x="0" y="8" class="idx">DIRECTORY // GITHUB</text>
      <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#C2C7F0" text-anchor="end">↗</text>

      <text x="0" y="28" class="name">All Public Repositories</text>

      <text x="0" y="46" class="desc">Explore open-source algorithmic tools, academic research</text>
      <text x="0" y="60" class="desc">experiments, and system software builds on GitHub.</text>

      <g transform="translate(0, 74)">
        <rect x="0" y="0" width="130" height="18" rx="5" fill="#1C1E2D" stroke="#555A82" stroke-width="0.8" />
        <text x="65" y="12.5" class="pill" text-anchor="middle">View Full Archive →</text>
      </g>
    </g>
  </g>
</svg>