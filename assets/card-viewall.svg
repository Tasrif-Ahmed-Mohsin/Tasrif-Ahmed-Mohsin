<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="card-p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D434F" />
      <stop offset="100%" stop-color="#37515F" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #97BAC7; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #F0F6F8; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #ADC5CF; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 700; fill: #E6F3F7; }
  </style>

  <rect x="1" y="1" width="328" height="122" rx="14" fill="url(#card-p6)" stroke="#537586" stroke-width="1.1" />

  <g transform="translate(18, 16)">
    <text x="0" y="8" class="idx">DIRECTORY // GITHUB</text>
    <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#B2D8E6" text-anchor="end">↗</text>

    <text x="0" y="28" class="name">All Public Repositories</text>

    <text x="0" y="46" class="desc">Explore open-source algorithmic tools, academic research</text>
    <text x="0" y="60" class="desc">experiments, and system software builds on GitHub.</text>

    <g transform="translate(0, 74)">
