    <rect x="120" y="0" width="72" height="22" rx="6" fill="#5A7580"/>
    <text x="156" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#B8CDD2" text-anchor="middle">Graph DFS</text>
