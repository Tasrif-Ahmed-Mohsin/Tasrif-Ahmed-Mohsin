<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="card-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23353F" />
      <stop offset="100%" stop-color="#2B404D" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #83A7B5; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #F0F6F8; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #A7C2CD; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 600; fill: #D0E4EC; }
  </style>

  <rect x="1" y="1" width="328" height="122" rx="14" fill="url(#card-p3)" stroke="#42606E" stroke-width="1" />

  <g transform="translate(18, 16)">
    <text x="0" y="8" class="idx">03 // GRAPH ALGORITHMS</text>
    <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#8BB2C2" text-anchor="end">↗</text>

    <text x="0" y="28" class="name">Way-to-BRAC Pathfinder</text>

    <text x="0" y="46" class="desc">Multimodal transit network optimizer utilizing DFS traversal,</text>
    <text x="0" y="60" class="desc">adjacency matrix representations, and an interactive route GUI.</text>

    <g transform="translate(0, 74)">
      <rect x="0" y="0" width="36" height="18" rx="5" fill="#1A2830" stroke="#3A5564" stroke-width="0.8" />
      <text x="18" y="12.5" class="pill" text-anchor="middle">Java</text>

      <rect x="42" y="0" width="60" height="18" rx="5" fill="#1A2830" stroke="#3A5564" stroke-width="0.8" />
      <text x="72" y="12.5" class="pill" text-anchor="middle">Swing GUI</text>

      <rect x="108" y="0" width="66" height="18" rx="5" fill="#1A2830" stroke="#3A5564" stroke-width="0.8" />
      <text x="141" y="12.5" class="pill" text-anchor="middle">Graph DFS</text>
    </g>
  </g>
</svg>
