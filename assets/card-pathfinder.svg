<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 118" width="100%" height="100%" style="background: transparent;">
  <style>
    /* Default / Universal Fallback */
    .card-outline { fill: none; stroke: #30363D; stroke-width: 1; }
    .card-inner-box { fill: none; stroke: #30363D; stroke-width: 0.8; }
    
    /* Lucidity Display Font (Headers / Titles) */
    .display-title { font-family: 'Lucidity', 'SF Pro Display', 'Space Grotesk', 'Outfit', -apple-system, sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; fill: #58A6FF; }
    .card-title { font-family: 'Lucidity', 'SF Pro Display', 'Space Grotesk', 'Outfit', -apple-system, sans-serif; font-weight: 700; letter-spacing: 0.6px; fill: #C9D1D9; }
    .section-meta { font-family: 'Lucidity', 'SF Mono', 'Space Grotesk', monospace; font-weight: 700; letter-spacing: 1.2px; fill: #58A6FF; }
    
    /* Garet Geometric Body Font */
    .body-text { font-family: 'Garet', 'SF Pro Text', 'Inter', -apple-system, sans-serif; font-weight: 400; letter-spacing: 0.3px; fill: #8B949E; }
    .tag-border { fill: none; stroke: #30363D; stroke-width: 0.8; }
    .tag-text { font-family: 'Garet', 'SF Pro Text', 'Inter', -apple-system, sans-serif; font-weight: 600; letter-spacing: 0.4px; fill: #8B949E; }

    /* Explicit Light Mode */
    @media (prefers-color-scheme: light) {
      .card-outline { stroke: #D0D7DE; }
      .card-inner-box { stroke: #D0D7DE; }
      .display-title { fill: #0969DA; }
      .card-title { fill: #1F2328; }
      .section-meta { fill: #0969DA; }
      .body-text { fill: #656D76; }
      .tag-border { stroke: #D0D7DE; }
      .tag-text { fill: #656D76; }
    }

    /* Explicit Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-outline { stroke: #30363D; }
      .card-inner-box { stroke: #30363D; }
      .display-title { fill: #58A6FF; }
      .card-title { fill: #F0F6FC; }
      .section-meta { fill: #58A6FF; }
      .body-text { fill: #8B949E; }
      .tag-border { stroke: #30363D; }
      .tag-text { fill: #8B949E; }
    }
  </style>

  <rect x="1" y="1" width="328" height="116" rx="8" class="card-outline" />

  <g transform="translate(18, 16)">
    <text x="0" y="8" font-size="9" class="section-meta">04 // GRAPH ALGORITHMS</text>
    <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" class="display-title" text-anchor="end">↗</text>

    <text x="0" y="28" font-size="12.5" class="card-title">Way-to-BRAC Pathfinder</text>

    <text x="0" y="45" font-size="10" class="body-text">Transit network optimizer modeling Dhaka roads as graph edges</text>
    <text x="0" y="58" font-size="10" class="body-text">with DFS route discovery and an interactive Java Swing GUI.</text>

    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="34" height="18" rx="4" class="tag-border" />
      <text x="17" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Java</text>
      <rect x="40" y="0" width="58" height="18" rx="4" class="tag-border" />
      <text x="69" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Swing GUI</text>
      <rect x="104" y="0" width="62" height="18" rx="4" class="tag-border" />
      <text x="135" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Graph DFS</text>
    </g>
  </g>
</svg>