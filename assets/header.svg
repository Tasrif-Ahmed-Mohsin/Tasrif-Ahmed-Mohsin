<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" style="background: transparent;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #FFFFFF; letter-spacing: -0.8px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; fill: #666666; letter-spacing: 0.3px; }
    .cursor { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect width="480" height="120" rx="10" fill="url(#bg)"/>
  <rect x="28" y="28" width="32" height="2" rx="1" fill="#333333"/>
  <text x="28" y="66" class="name">Tasrif Ahmed Mohsin</text>
  <text x="28" y="90" class="sub">CS @ BRAC University · builds things that see, think, and move</text>
  <rect x="423" y="78" width="1.5" height="14" rx="0.75" fill="#555555" class="cursor"/>
</svg>