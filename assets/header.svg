<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 136" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Mathematical Seigaiha Concentric Japanese Wave Vector Pattern -->
    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 A 20 20 0 0 1 40 20 M 5 20 A 15 15 0 0 1 35 20 M 10 20 A 10 10 0 0 1 30 20 M 15 20 A 5 5 0 0 1 25 20 M -20 10 A 20 20 0 0 1 20 10 M -15 10 A 15 15 0 0 1 15 10 M -10 10 A 10 10 0 0 1 10 10 M -5 10 A 5 5 0 0 1 5 10 M 20 10 A 20 20 0 0 1 60 10 M 25 10 A 15 15 0 0 1 55 10 M 30 10 A 10 10 0 0 1 50 10 M 35 10 A 5 5 0 0 1 45 10 M 0 0 A 20 20 0 0 1 40 0 M 5 0 A 15 15 0 0 1 35 0 M 10 0 A 10 10 0 0 1 30 0 M 15 0 A 5 5 0 0 1 25 0" fill="none" class="wave-stroke" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    /* Default / Light Mode */
    .card-bg { fill: rgba(248, 250, 252, 0.6); stroke: #CBD5E1; }
    .card-inner { fill: rgba(241, 245, 249, 0.7); stroke: #E2E8F0; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0F172A; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; fill: #475569; }
    .meta { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-weight: 600; fill: #2563EB; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; fill: #475569; }
    .pill-bg { fill: rgba(15, 23, 42, 0.04); stroke: #CBD5E1; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; fill: #334155; }
    .icon { stroke: #2563EB; }
    .wave-stroke { stroke: #2563EB; opacity: 0.14; }
    .wave-art { fill: #2563EB; opacity: 0.07; }
    .wave-foam { stroke: #2563EB; opacity: 0.25; }

    /* GitHub Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: rgba(22, 27, 34, 0.65); stroke: #30363D; }
      .card-inner { fill: rgba(13, 17, 23, 0.75); stroke: #21262D; }
      .title { fill: #F0F6FC; }
      .sub { fill: #8B949E; }
      .meta { fill: #58A6FF; }
      .desc { fill: #8B949E; }
      .pill-bg { fill: rgba(240, 246, 252, 0.06); stroke: #30363D; }
      .pill-txt { fill: #C9D1D9; }
      .icon { stroke: #58A6FF; }
      .wave-stroke { stroke: #58A6FF; opacity: 0.16; }
      .wave-art { fill: #58A6FF; opacity: 0.08; }
      .wave-foam { stroke: #58A6FF; opacity: 0.35; }
    }
  </style>

  <!-- Card Border & Backgroundless Canvas -->
  <rect x="1" y="1" width="678" height="134" rx="8" class="card-bg" stroke-width="1.2" />

  <!-- Japanese Seigaiha Wave Pattern Background -->
  <rect x="2" y="2" width="676" height="132" rx="8" fill="url(#seigaiha)" />

  <!-- Vector Great Wave Crest Art (Right-side artistic silhouette) -->
  <g transform="translate(480, 20)">
    <!-- Main Wave Surge Body -->
    <path d="M 0 114 C 40 100, 80 70, 110 30 C 125 10, 140 0, 155 10 C 170 20, 150 45, 130 55 C 150 48, 175 48, 190 70 C 175 68, 160 75, 150 85 C 165 80, 185 85, 195 100 L 200 114 Z" class="wave-art" />
    <!-- Wave Claws / Sea Foam Lines -->
    <path d="M 110 30 C 115 15, 125 8, 135 12 C 145 16, 138 28, 125 35" fill="none" class="wave-foam" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 128 22 C 138 12, 148 8, 158 14 C 168 20, 155 34, 142 42" fill="none" class="wave-foam" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 148 48 C 162 38, 176 38, 186 48 C 196 58, 180 68, 166 72" fill="none" class="wave-foam" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Left Content -->
  <g transform="translate(32, 28)">
    <!-- System Seal / Wave Glyph -->
    <g transform="translate(0, 0)">
      <path d="M0 6 C 2 2, 5 2, 7 6 C 9 10, 12 10, 14 6" class="icon" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="22" y="8" font-size="10" class="meta" letter-spacing="0.5">SYSTEM // PORTFOLIO 2026</text>
    </g>

    <text x="0" y="42" font-size="27" class="title" letter-spacing="-0.6px">Tasrif Ahmed Mohsin</text>
    <text x="0" y="66" font-size="12" font-weight="500" class="sub">CS Undergrad @ BRAC University · Autonomous Systems &amp; Deep Learning</text>
    <text x="0" y="84" font-size="11" class="desc">Computer Vision · Deterministic Robotics · Spatial Intelligence · Graph Algorithms</text>
  </g>

  <!-- Right Status Stamp Widget -->
  <g transform="translate(544, 24)">
    <rect x="0" y="0" width="104" height="88" rx="8" class="card-inner" stroke-width="1" />
    <text x="52" y="24" font-size="10" class="meta" text-anchor="middle">ACTIVE</text>
    <text x="52" y="52" font-size="22" class="title" text-anchor="middle">DHAKA</text>
    <text x="52" y="72" font-size="10" class="meta" text-anchor="middle">UTC+6</text>
  </g>
</svg>