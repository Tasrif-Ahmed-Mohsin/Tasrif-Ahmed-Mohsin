<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0E1219" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#202836" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#141A24" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#263142" />
      <stop offset="100%" stop-color="#19202C" />
    </linearGradient>

    <filter id="stack-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .cat-title { font-size: 11px; font-weight: 700; fill: #64748B; letter-spacing: 1.2px; text-transform: uppercase; }
    .pill-label { font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .badge-count { font-size: 9.5px; font-weight: 700; fill: #38BDF8; }
    .domain-text { font-size: 11.5px; font-weight: 500; fill: #94A3B8; }
  </style>

  <!-- Container -->
  <g filter="url(#stack-shadow)">
    <rect x="0" y="0" width="940" height="320" rx="24" fill="url(#stack-bg)" stroke="#273244" stroke-width="1.2" />

    <!-- Top Header inside Container -->
    <g transform="translate(32, 28)">
      <circle cx="6" cy="6" r="3.5" fill="#38BDF8" />
      <text x="18" y="10" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3px">ENGINEERING CAPABILITIES &amp; TECHNICAL ARSENAL</text>
      <text x="18" y="26" font-size="11.5" fill="#64748B">Curated toolchain for deep learning pipelines, system architecture, and robust algorithmic software.</text>
    </g>

    <!-- 3-Column Bento Layout -->
    
    <!-- COLUMN 1: LANGUAGES -->
    <g transform="translate(32, 76)">
      <rect x="0" y="0" width="276" height="216" rx="16" fill="url(#card-grad)" stroke="#232C3B" stroke-width="1" />
      
      <!-- Column Header -->
      <g transform="translate(18, 18)">
        <text x="0" y="10" class="cat-title">LANGUAGES</text>
        <rect x="200" y="-3" width="26" height="18" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
        <text x="213" y="10" class="badge-count" text-anchor="middle">05</text>
      </g>

      <!-- Language Pills -->
      <!-- Python -->
      <g transform="translate(18, 46)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#38BDF8" />
        <text x="26" y="20" class="pill-label">Python</text>
      </g>
      <!-- Java -->
      <g transform="translate(142, 46)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#F59E0B" />
        <text x="26" y="20" class="pill-label">Java</text>
      </g>
      <!-- C++ -->
      <g transform="translate(18, 88)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#3B82F6" />
        <text x="26" y="20" class="pill-label">C++</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(142, 88)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#60A5FA" />
        <text x="26" y="20" class="pill-label">TypeScript</text>
      </g>
      <!-- SQL & Bash -->
      <g transform="translate(18, 130)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#A78BFA" />
        <text x="26" y="20" class="pill-label">SQL / DB</text>
      </g>
      <g transform="translate(142, 130)">
        <rect x="0" y="0" width="114" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#34D399" />
        <text x="26" y="20" class="pill-label">Bash / CLI</text>
      </g>
      <!-- Sub info -->
      <text x="18" y="196" font-size="10" fill="#64748B">Core algorithmic &amp; system foundations</text>
    </g>

    <!-- COLUMN 2: AI / ML & VISION -->
    <g transform="translate(328, 76)">
      <rect x="0" y="0" width="284" height="216" rx="16" fill="url(#card-grad)" stroke="#232C3B" stroke-width="1" />
      
      <!-- Column Header -->
      <g transform="translate(18, 18)">
        <text x="0" y="10" class="cat-title">AI, ML &amp; COMPUTER VISION</text>
        <rect x="210" y="-3" width="26" height="18" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
        <text x="223" y="10" class="badge-count" text-anchor="middle">06</text>
      </g>

      <!-- AI Pills -->
      <g transform="translate(18, 46)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#EF4444" />
        <text x="26" y="20" class="pill-label">PyTorch</text>
      </g>
      <g transform="translate(146, 46)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#10B981" />
        <text x="26" y="20" class="pill-label">YOLOv10</text>
      </g>
      <g transform="translate(18, 88)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#06B6D4" />
        <text x="26" y="20" class="pill-label">OpenCV</text>
      </g>
      <g transform="translate(146, 88)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#F97316" />
        <text x="26" y="20" class="pill-label">scikit-learn</text>
      </g>
      <g transform="translate(18, 130)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#EC4899" />
        <text x="26" y="20" class="pill-label">Streamlit</text>
      </g>
      <g transform="translate(146, 130)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="url(#pill-grad)" stroke="#334155" stroke-width="0.8" />
        <circle cx="14" cy="16" r="3.5" fill="#8B5CF6" />
        <text x="26" y="20" class="pill-label">Folium / Geo</text>
      </g>
      <text x="18" y="196" font-size="10" fill="#64748B">Model training, spatial inference &amp; deployment</text>
    </g>

    <!-- COLUMN 3: SYSTEM ARCHITECTURE & DOMAINS -->
    <g transform="translate(632, 76)">
      <rect x="0" y="0" width="276" height="216" rx="16" fill="url(#card-grad)" stroke="#232C3B" stroke-width="1" />
      
      <!-- Column Header -->
      <g transform="translate(18, 18)">
        <text x="0" y="10" class="cat-title">SPECIALIZED DOMAINS</text>
        <rect x="200" y="-3" width="26" height="18" rx="9" fill="#0F172A" stroke="#1E293B" stroke-width="0.8" />
        <text x="213" y="10" class="badge-count" text-anchor="middle">04</text>
      </g>

      <!-- Domain List Items with minimalist indicators -->
      <g transform="translate(18, 48)">
        <!-- Item 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="240" height="28" rx="6" fill="#131923" stroke="#1E2635" stroke-width="0.8" />
          <circle cx="12" cy="14" r="3" fill="#34D399" />
          <text x="24" y="18" class="domain-text">Computer Vision &amp; Detection</text>
        </g>
        <!-- Item 2 -->
        <g transform="translate(0, 34)">
          <rect x="0" y="0" width="240" height="28" rx="6" fill="#131923" stroke="#1E2635" stroke-width="0.8" />
          <circle cx="12" cy="14" r="3" fill="#38BDF8" />
          <text x="24" y="18" class="domain-text">Graph Algorithms &amp; Pathfinding</text>
        </g>
        <!-- Item 3 -->
        <g transform="translate(0, 68)">
          <rect x="0" y="0" width="240" height="28" rx="6" fill="#131923" stroke="#1E2635" stroke-width="0.8" />
          <circle cx="12" cy="14" r="3" fill="#A855F7" />
          <text x="24" y="18" class="domain-text">Spatial ML &amp; Geospatial Modeling</text>
        </g>
        <!-- Item 4 -->
        <g transform="translate(0, 102)">
          <rect x="0" y="0" width="240" height="28" rx="6" fill="#131923" stroke="#1E2635" stroke-width="0.8" />
          <circle cx="12" cy="14" r="3" fill="#F43F5E" />
          <text x="24" y="18" class="domain-text">Deterministic Robotics &amp; State</text>
        </g>
      </g>

      <text x="18" y="196" font-size="10" fill="#64748B">Production-oriented software engineering</text>
    </g>

  </g>
</svg>