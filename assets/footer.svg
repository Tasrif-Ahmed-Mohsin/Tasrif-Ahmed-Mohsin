<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 100" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="light-foot-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="light-foot-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="light-foot-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748B" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <g filter="url(#light-foot-shadow)">
    <rect x="0" y="0" width="960" height="100" rx="20" fill="url(#light-foot-bg)" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Left info -->
    <g transform="translate(32, 38)">
      <text x="0" y="10" font-size="13.5" font-weight="800" fill="#0F172A">Tasrif Ahmed Mohsin</text>
      <text x="0" y="28" font-size="11" font-weight="500" fill="#64748B">BRAC University · Dhaka, Bangladesh</text>
    </g>

    <!-- Center / Right interactive buttons -->
    <g transform="translate(310, 32)">
      <!-- Official Website Pill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="36" rx="10" fill="#0F172A" />
        <text x="72" y="22" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">↗ tasrif.tech</text>
      </g>

      <!-- Email Pill -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="146" height="36" rx="10" fill="url(#light-foot-pill)" stroke="#CBD5E1" stroke-width="1" />
        <text x="73" y="22" font-size="11.5" font-weight="600" fill="#1E293B" text-anchor="middle">✉ Email Me</text>
      </g>

      <!-- LinkedIn Pill -->
      <g transform="translate(314, 0)">
        <rect x="0" y="0" width="140" height="36" rx="10" fill="url(#light-foot-pill)" stroke="#CBD5E1" stroke-width="1" />
        <text x="70" y="22" font-size="11.5" font-weight="600" fill="#1E293B" text-anchor="middle">LinkedIn Profile</text>
      </g>

      <!-- GitHub Pill -->
      <g transform="translate(466, 0)">
        <rect x="0" y="0" width="140" height="36" rx="10" fill="url(#light-foot-pill)" stroke="#CBD5E1" stroke-width="1" />
        <text x="70" y="22" font-size="11.5" font-weight="600" fill="#1E293B" text-anchor="middle">GitHub Repos</text>
      </g>
    </g>
  </g>
</svg>