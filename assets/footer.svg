<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 100" width="100%" height="100%" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="50%" stop-color="#1B2230" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>

    <linearGradient id="foot-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242E3E" />
      <stop offset="100%" stop-color="#1A212D" />
    </linearGradient>

    <filter id="foot-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#foot-shadow)">
    <rect x="0" y="0" width="940" height="100" rx="20" fill="url(#foot-bg)" stroke="#2A3649" stroke-width="1.2" />

    <!-- Left status -->
    <g transform="translate(32, 38)">
      <text x="0" y="10" font-size="13" font-weight="700" fill="#FFFFFF">Tasrif Ahmed Mohsin</text>
      <text x="0" y="28" font-size="11" fill="#64748B">BRAC University · Dhaka, Bangladesh</text>
    </g>

    <!-- Center / Right interactive-style badges -->
    <g transform="translate(310, 32)">
      <!-- Official Website Pill -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="36" rx="10" fill="url(#foot-pill)" stroke="#38BDF8" stroke-width="0.9" />
        <text x="69" y="22" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">↗ tasrif.tech</text>
      </g>

      <!-- Email Pill -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="144" height="36" rx="10" fill="url(#foot-pill)" stroke="#334155" stroke-width="0.8" />
        <text x="72" y="22" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">✉ Email Me</text>
      </g>

      <!-- LinkedIn Pill -->
      <g transform="translate(306, 0)">
        <rect x="0" y="0" width="138" height="36" rx="10" fill="url(#foot-pill)" stroke="#334155" stroke-width="0.8" />
        <text x="69" y="22" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">LinkedIn Profile</text>
      </g>

      <!-- GitHub Pill -->
      <g transform="translate(456, 0)">
        <rect x="0" y="0" width="138" height="36" rx="10" fill="url(#foot-pill)" stroke="#334155" stroke-width="0.8" />
        <text x="69" y="22" font-size="11.5" font-weight="600" fill="#E2E8F0" text-anchor="middle">GitHub Repos</text>
      </g>
    </g>
  </g>
</svg>