    <rect x="58" y="0" width="56" height="22" rx="6" fill="#5A7580"/>
    <text x="86" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#B8CDD2" text-anchor="middle">PyTorch</text>
    <rect x="120" y="0" width="56" height="22" rx="6" fill="#5A7580"/>
    <text x="148" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#B8CDD2" text-anchor="middle">OpenCV</text>
    <rect x="182" y="0" width="60" height="22" rx="6" fill="#5A7580"/>
    <text x="212" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#B8CDD2" text-anchor="middle">YOLOv10</text>
