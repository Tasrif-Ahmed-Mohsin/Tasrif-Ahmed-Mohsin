<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150" style="background: transparent;">
  <rect width="320" height="150" rx="16" fill="#6B8590"/>
  <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#E0EAED">🎯</text>
  <text x="46" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#E0EAED">Gun Detection — YOLOv10</text>
  <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8EA3A9">Real-time firearm detection and</text>
  <text x="20" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8EA3A9">localization using deep learning</text>
  <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8EA3A9">inference on live video streams.</text>
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="52" height="22" rx="6" fill="#5A7580"/>
