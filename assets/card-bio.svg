<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 86" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="bio-clip">
      <rect width="680" height="86" rx="16" />
    </clipPath>
    <linearGradient id="bio-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2C40" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34374E" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <style>
    .bio-title { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #9BA0C9; letter-spacing: 1.2px; }
    .bio-body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #F0F2FA; }
    .bio-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 10.5px; fill: #A5A9CC; }
  </style>

  <g clip-path="url(#bio-clip)">
    <image href="data:image/jpeg;base64," width="680" height="86" preserveAspectRatio="xMidYMid slice" />
    <rect width="680" height="86" fill="url(#bio-overlay)" />
    <rect x="0.5" y="0.5" width="679" height="85" rx="16" fill="none" stroke="#585C84" stroke-width="1.1" />

    <g transform="translate(24, 18)">
      <text x="0" y="8" class="bio-title">OVERVIEW</text>
      <text x="0" y="30" class="bio-body">Computer science engineer building real-time vision pipelines (YOLOv10 / PyTorch) and deterministic robotics software.</text>
      <text x="0" y="48" class="bio-sub">Focused on mathematically rigorous graph search, robust embedded state machines, and production-grade architectures.</text>
    </g>
  </g>
</svg>