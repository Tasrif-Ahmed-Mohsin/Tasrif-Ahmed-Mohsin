<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 144" width="100%" height="100%" style="background: transparent;">
  <style>
    /* Default / Universal Fallback */
    .card-outline { fill: none; stroke: #30363D; stroke-width: 1; }
    .card-inner-box { fill: none; stroke: #30363D; stroke-width: 0.8; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #58A6FF; }
    .primary-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #C9D1D9; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #8B949E; }
    .meta-text { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-weight: 600; fill: #58A6FF; }
    .tag-border { fill: none; stroke: #30363D; stroke-width: 0.8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; fill: #8B949E; }

    /* Explicit Light Mode */
    @media (prefers-color-scheme: light) {
      .card-outline { stroke: #D0D7DE; }
      .card-inner-box { stroke: #D0D7DE; }
      .title-text { fill: #0969DA; }
      .primary-text { fill: #1F2328; }
      .body-text { fill: #656D76; }
      .meta-text { fill: #0969DA; }
      .tag-border { stroke: #D0D7DE; }
      .tag-text { fill: #656D76; }
    }

    /* Explicit Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-outline { stroke: #30363D; }
      .card-inner-box { stroke: #30363D; }
      .title-text { fill: #58A6FF; }
      .primary-text { fill: #F0F6FC; }
      .body-text { fill: #8B949E; }
      .meta-text { fill: #58A6FF; }
      .tag-border { stroke: #30363D; }
      .tag-text { fill: #8B949E; }
    }
  </style>

  <rect x="1" y="1" width="678" height="142" rx="8" class="card-outline" />

  <!-- SECTION 1: LANGUAGES -->
  <g transform="translate(24, 16)">
    <text x="0" y="8" font-size="9.5" class="meta-text" letter-spacing="0.8">01 // LANGUAGES</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="48" height="20" rx="4" class="tag-border" />
      <text x="24" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Python</text>

      <rect x="54" y="0" width="42" height="20" rx="4" class="tag-border" />
      <text x="75" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Java</text>

      <rect x="102" y="0" width="38" height="20" rx="4" class="tag-border" />
      <text x="121" y="13.5" font-size="9" class="primary-text" text-anchor="middle">C++</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="70" height="20" rx="4" class="tag-border" />
      <text x="35" y="13.5" font-size="9" class="primary-text" text-anchor="middle">TypeScript</text>

      <rect x="76" y="0" width="36" height="20" rx="4" class="tag-border" />
      <text x="94" y="13.5" font-size="9" class="primary-text" text-anchor="middle">SQL</text>

      <rect x="118" y="0" width="38" height="20" rx="4" class="tag-border" />
      <text x="137" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Bash</text>
    </g>
  </g>

  <!-- Divider Line 1 -->
  <line x1="206" y1="18" x2="206" y2="126" class="card-inner-box" />

  <!-- SECTION 2: AI / ML & VISION -->
  <g transform="translate(224, 16)">
    <text x="0" y="8" font-size="9.5" class="meta-text" letter-spacing="0.8">02 // AI &amp; COMPUTER VISION</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="52" height="20" rx="4" class="tag-border" />
      <text x="26" y="13.5" font-size="9" class="primary-text" text-anchor="middle">PyTorch</text>

      <rect x="58" y="0" width="54" height="20" rx="4" class="tag-border" />
      <text x="85" y="13.5" font-size="9" class="primary-text" text-anchor="middle">YOLOv10</text>

      <rect x="118" y="0" width="52" height="20" rx="4" class="tag-border" />
      <text x="144" y="13.5" font-size="9" class="primary-text" text-anchor="middle">OpenCV</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="66" height="20" rx="4" class="tag-border" />
      <text x="33" y="13.5" font-size="9" class="primary-text" text-anchor="middle">scikit-learn</text>

      <rect x="72" y="0" width="56" height="20" rx="4" class="tag-border" />
      <text x="100" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Streamlit</text>

      <rect x="134" y="0" width="46" height="20" rx="4" class="tag-border" />
      <text x="157" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Folium</text>
    </g>
  </g>

  <!-- Divider Line 2 -->
  <line x1="434" y1="18" x2="434" y2="126" class="card-inner-box" />

  <!-- SECTION 3: DOMAINS -->
  <g transform="translate(452, 16)">
    <text x="0" y="8" font-size="9.5" class="meta-text" letter-spacing="0.8">03 // CORE DOMAINS</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="94" height="20" rx="4" class="tag-border" />
      <text x="47" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Computer Vision</text>

      <rect x="100" y="0" width="92" height="20" rx="4" class="tag-border" />
      <text x="146" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Graph DFS/BFS</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="94" height="20" rx="4" class="tag-border" />
      <text x="47" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Deterministic State</text>

      <rect x="100" y="0" width="92" height="20" rx="4" class="tag-border" />
      <text x="146" y="13.5" font-size="9" class="primary-text" text-anchor="middle">Embedded C++</text>
    </g>
  </g>
</svg>