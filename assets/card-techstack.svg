<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 152" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="tech-clip">
      <rect width="680" height="152" rx="18" />
    </clipPath>
    <linearGradient id="tech-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2030" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#27293E" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <style>
    .cat-head { font-family: 'SF Mono', Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #979CC4; letter-spacing: 1px; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 9px; font-weight: 600; fill: #DFE2F5; }
    .domain-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 9px; font-weight: 600; fill: #DFE2F5; }
  </style>

  <g clip-path="url(#tech-clip)">
    <image href="data:image/jpeg;base64," width="680" height="152" preserveAspectRatio="xMidYMid slice" />
    <rect width="680" height="152" fill="url(#tech-overlay)" />
    <rect x="0.5" y="0.5" width="679" height="151" rx="18" fill="none" stroke="#50547A" stroke-width="1.1" />

    <!-- SECTION 1: LANGUAGES -->
    <g transform="translate(24, 18)">
      <text x="0" y="8" class="cat-head">01 // LANGUAGES</text>
      
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="50" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="25" y="13.5" class="pill-label" text-anchor="middle">Python</text>

        <rect x="56" y="0" width="44" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="78" y="13.5" class="pill-label" text-anchor="middle">Java</text>

        <rect x="106" y="0" width="42" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="127" y="13.5" class="pill-label" text-anchor="middle">C++</text>
      </g>

      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="72" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="36" y="13.5" class="pill-label" text-anchor="middle">TypeScript</text>

        <rect x="78" y="0" width="38" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="97" y="13.5" class="pill-label" text-anchor="middle">SQL</text>

        <rect x="122" y="0" width="42" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="143" y="13.5" class="pill-label" text-anchor="middle">Bash</text>
      </g>
    </g>

    <!-- Divider Line 1 -->
    <line x1="210" y1="20" x2="210" y2="132" stroke="#424563" stroke-width="0.8" />

    <!-- SECTION 2: AI / ML & VISION -->
    <g transform="translate(230, 18)">
      <text x="0" y="8" class="cat-head">02 // AI &amp; COMPUTER VISION</text>

      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="54" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="27" y="13.5" class="pill-label" text-anchor="middle">PyTorch</text>

        <rect x="60" y="0" width="56" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="88" y="13.5" class="pill-label" text-anchor="middle">YOLOv10</text>

        <rect x="122" y="0" width="54" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="149" y="13.5" class="pill-label" text-anchor="middle">OpenCV</text>
      </g>

      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="68" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="34" y="13.5" class="pill-label" text-anchor="middle">scikit-learn</text>

        <rect x="74" y="0" width="58" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="103" y="13.5" class="pill-label" text-anchor="middle">Streamlit</text>

        <rect x="138" y="0" width="48" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="162" y="13.5" class="pill-label" text-anchor="middle">Folium</text>
      </g>
    </g>

    <!-- Divider Line 2 -->
    <line x1="446" y1="20" x2="446" y2="132" stroke="#424563" stroke-width="0.8" />

    <!-- SECTION 3: DOMAINS -->
    <g transform="translate(466, 18)">
      <text x="0" y="8" class="cat-head">03 // CORE DOMAINS</text>

      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="94" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="47" y="13.5" class="domain-label" text-anchor="middle">Computer Vision</text>

        <rect x="100" y="0" width="90" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="145" y="13.5" class="domain-label" text-anchor="middle">Graph DFS/BFS</text>
      </g>

      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="94" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="47" y="13.5" class="domain-label" text-anchor="middle">Deterministic State</text>

        <rect x="100" y="0" width="90" height="20" rx="5" fill="#181A26" stroke="#454866" stroke-width="0.8" />
        <text x="145" y="13.5" class="domain-label" text-anchor="middle">Embedded C++</text>
      </g>
    </g>
  </g>
</svg>