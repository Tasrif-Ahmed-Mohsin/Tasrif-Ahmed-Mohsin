<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 152" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Mathematical Seigaiha Concentric Japanese Wave Vector Pattern -->
    <pattern id="seigaiha" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 20 A 20 20 0 0 1 40 20 M 5 20 A 15 15 0 0 1 35 20 M 10 20 A 10 10 0 0 1 30 20 M 15 20 A 5 5 0 0 1 25 20 M -20 10 A 20 20 0 0 1 20 10 M -15 10 A 15 15 0 0 1 15 10 M -10 10 A 10 10 0 0 1 10 10 M -5 10 A 5 5 0 0 1 5 10 M 20 10 A 20 20 0 0 1 60 10 M 25 10 A 15 15 0 0 1 55 10 M 30 10 A 10 10 0 0 1 50 10 M 35 10 A 5 5 0 0 1 45 10 M 0 0 A 20 20 0 0 1 40 0 M 5 0 A 15 15 0 0 1 35 0 M 10 0 A 10 10 0 0 1 30 0 M 15 0 A 5 5 0 0 1 25 0" fill="none" class="wave-stroke" stroke-width="0.75" />
    </pattern>
  </defs>

  <style>
    /* Default / Light Mode */
    .card-bg { fill: rgba(248, 250, 252, 0.6); stroke: #CBD5E1; }
    .card-inner { fill: rgba(241, 245, 249, 0.7); stroke: #E2E8F0; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0F172A; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; fill: #475569; }
    .meta { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-weight: 600; fill: #2563EB; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; fill: #475569; }
    .pill-bg { fill: rgba(15, 23, 42, 0.04); stroke: #CBD5E1; }
    .pill-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 600; fill: #334155; }
    .icon { stroke: #2563EB; }
    .wave-stroke { stroke: #2563EB; opacity: 0.14; }
    .wave-art { fill: #2563EB; opacity: 0.07; }
    .wave-foam { stroke: #2563EB; opacity: 0.25; }

    /* GitHub Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: rgba(22, 27, 34, 0.65); stroke: #30363D; }
      .card-inner { fill: rgba(13, 17, 23, 0.75); stroke: #21262D; }
      .title { fill: #F0F6FC; }
      .sub { fill: #8B949E; }
      .meta { fill: #58A6FF; }
      .desc { fill: #8B949E; }
      .pill-bg { fill: rgba(240, 246, 252, 0.06); stroke: #30363D; }
      .pill-txt { fill: #C9D1D9; }
      .icon { stroke: #58A6FF; }
      .wave-stroke { stroke: #58A6FF; opacity: 0.16; }
      .wave-art { fill: #58A6FF; opacity: 0.08; }
      .wave-foam { stroke: #58A6FF; opacity: 0.35; }
    }
  </style>

  <rect x="1" y="1" width="678" height="150" rx="8" class="card-bg" stroke-width="1.1" />
  <rect x="2" y="2" width="676" height="148" rx="8" fill="url(#seigaiha)" />

  <!-- SECTION 1: LANGUAGES -->
  <g transform="translate(24, 18)">
    <text x="0" y="8" font-size="9.5" class="meta" letter-spacing="1">01 // LANGUAGES</text>
    
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="50" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="25" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Python</text>

      <rect x="56" y="0" width="44" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="78" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Java</text>

      <rect x="106" y="0" width="42" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="127" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">C++</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="72" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="36" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">TypeScript</text>

      <rect x="78" y="0" width="38" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="97" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">SQL</text>

      <rect x="122" y="0" width="42" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="143" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Bash</text>
    </g>
  </g>

  <!-- Divider Line 1 -->
  <line x1="210" y1="20" x2="210" y2="132" class="card-bg" stroke-width="1" />

  <!-- SECTION 2: AI / ML & VISION -->
  <g transform="translate(230, 18)">
    <text x="0" y="8" font-size="9.5" class="meta" letter-spacing="1">02 // AI &amp; COMPUTER VISION</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="54" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="27" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">PyTorch</text>

      <rect x="60" y="0" width="56" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="88" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">YOLOv10</text>

      <rect x="122" y="0" width="54" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="149" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">OpenCV</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="68" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="34" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">scikit-learn</text>

      <rect x="74" y="0" width="58" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="103" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Streamlit</text>

      <rect x="138" y="0" width="48" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="162" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Folium</text>
    </g>
  </g>

  <!-- Divider Line 2 -->
  <line x1="446" y1="20" x2="446" y2="132" class="card-bg" stroke-width="1" />

  <!-- SECTION 3: DOMAINS -->
  <g transform="translate(466, 18)">
    <text x="0" y="8" font-size="9.5" class="meta" letter-spacing="1">03 // CORE DOMAINS</text>

    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="94" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="47" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Computer Vision</text>

      <rect x="100" y="0" width="90" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="145" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Graph DFS/BFS</text>
    </g>

    <g transform="translate(0, 46)">
      <rect x="0" y="0" width="94" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="47" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Deterministic State</text>

      <rect x="100" y="0" width="90" height="20" rx="4" class="pill-bg" stroke-width="0.8" />
      <text x="145" y="13.5" font-size="9" class="pill-txt" text-anchor="middle">Embedded C++</text>
    </g>
  </g>
</svg>