<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="card-clip">
      <rect width="330" height="124" rx="8" />
    </clipPath>
    <linearGradient id="card-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2C" stop-opacity="0.84" />
      <stop offset="100%" stop-color="#172A42" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #8CB1D8; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #F4F8FD; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #B4CEE8; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 600; fill: #DCEAF8; }
  </style>

  <g clip-path="url(#card-clip)">
    <image href="data:image/jpeg;base64," width="330" height="124" preserveAspectRatio="xMidYMid slice" />
    <rect width="330" height="124" fill="url(#card-overlay)" />
    <rect x="0.5" y="0.5" width="329" height="123" rx="8" fill="none" stroke="#2B4970" stroke-width="1" />

    <g transform="translate(18, 15)">
      <!-- Top Row: Icon + Index + Arrow -->
      <g transform="translate(0, 0)">
        <g transform="translate(0, 0)">
  <path d="M7 1 C4.5 1 2.5 3 2.5 5.5 C2.5 8.8 7 13.5 7 13.5 C7 13.5 11.5 8.8 11.5 5.5 C11.5 3 9.5 1 7 1 Z" stroke="#7AA4D4" stroke-width="1.2" fill="none"/>
  <circle cx="7" cy="5.5" r="1.8" fill="#7AA4D4"/>
</g>
        <text x="22" y="11" class="idx">02 // SPATIAL INTELLIGENCE</text>
        <text x="294" y="11" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#8BB3DF" text-anchor="end">↗</text>
      </g>

      <!-- Title -->
      <text x="0" y="32" class="name">Restaurant Success Predictor</text>

      <!-- Description -->
      <text x="0" y="48" class="desc">Urban economic feasibility ML model with geospatial heatmap</text>
      <text x="0" y="62" class="desc">clustering and demographic viability scoring algorithms.</text>

      <!-- Pills -->
      <g transform="translate(0, 76)">
      <rect x="0" y="0" width="46" height="18" rx="4" fill="#0C1726" stroke="#2E4B72" stroke-width="0.8" />
      <text x="23" y="12.5" class="pill" text-anchor="middle">Python</text>
      <rect x="52" y="0" width="56" height="18" rx="4" fill="#0C1726" stroke="#2E4B72" stroke-width="0.8" />
      <text x="80" y="12.5" class="pill" text-anchor="middle">Streamlit</text>
      <rect x="114" y="0" width="66" height="18" rx="4" fill="#0C1726" stroke="#2E4B72" stroke-width="0.8" />
      <text x="147" y="12.5" class="pill" text-anchor="middle">scikit-learn</text>
      <rect x="186" y="0" width="46" height="18" rx="4" fill="#0C1726" stroke="#2E4B72" stroke-width="0.8" />
      <text x="209" y="12.5" class="pill" text-anchor="middle">Folium</text>
      </g>
    </g>
  </g>
</svg>