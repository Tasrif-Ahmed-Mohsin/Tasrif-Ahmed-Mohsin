<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 118" width="100%" height="100%" style="background: transparent;">
  <style>
    /* Default / Universal Fallback */
    .card-outline { fill: none; stroke: #30363D; stroke-width: 1; }
    .card-inner-box { fill: none; stroke: #30363D; stroke-width: 0.8; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #58A6FF; }
    .primary-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #C9D1D9; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #8B949E; }
    .meta-text { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; font-weight: 600; fill: #58A6FF; }
    .tag-border { fill: none; stroke: #30363D; stroke-width: 0.8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; fill: #8B949E; }

    /* Explicit Light Mode */
    @media (prefers-color-scheme: light) {
      .card-outline { stroke: #D0D7DE; }
      .card-inner-box { stroke: #D0D7DE; }
      .title-text { fill: #0969DA; }
      .primary-text { fill: #1F2328; }
      .body-text { fill: #656D76; }
      .meta-text { fill: #0969DA; }
      .tag-border { stroke: #D0D7DE; }
      .tag-text { fill: #656D76; }
    }

    /* Explicit Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card-outline { stroke: #30363D; }
      .card-inner-box { stroke: #30363D; }
      .title-text { fill: #58A6FF; }
      .primary-text { fill: #F0F6FC; }
      .body-text { fill: #8B949E; }
      .meta-text { fill: #58A6FF; }
      .tag-border { stroke: #30363D; }
      .tag-text { fill: #8B949E; }
    }
  </style>

  <rect x="1" y="1" width="328" height="116" rx="8" class="card-outline" />

  <g transform="translate(18, 16)">
    <text x="0" y="8" font-size="9" class="meta-text" letter-spacing="0.8">02 // SPATIAL ML</text>
    <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" class="title-text" text-anchor="end">↗</text>

    <text x="0" y="28" font-size="13" class="primary-text">Restaurant Success Predictor</text>

    <text x="0" y="45" font-size="10" class="body-text">Geospatial feasibility ML web app predicting success in Dhaka</text>
    <text x="0" y="58" font-size="10" class="body-text">using RandomForest regression, coordinates &amp; interactive heatmaps.</text>

    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="44" height="18" rx="4" class="tag-border" />
      <text x="22" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Python</text>
      <rect x="50" y="0" width="54" height="18" rx="4" class="tag-border" />
      <text x="77" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Streamlit</text>
      <rect x="110" y="0" width="64" height="18" rx="4" class="tag-border" />
      <text x="142" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">scikit-learn</text>
      <rect x="180" y="0" width="44" height="18" rx="4" class="tag-border" />
      <text x="202" y="12.5" font-size="8.5" class="tag-text" text-anchor="middle">Folium</text>
    </g>
  </g>
</svg>