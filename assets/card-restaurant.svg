<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 124" width="100%" height="100%" style="background: transparent;">
  <defs>
    <clipPath id="card-clip">
      <rect width="330" height="124" rx="14" />
    </clipPath>
    <linearGradient id="card-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2030" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#282A3E" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <style>
    .idx { font-family: 'SF Mono', Consolas, monospace; font-size: 9px; font-weight: 700; fill: #979CC4; letter-spacing: 1px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; font-size: 13.5px; font-weight: 700; fill: #F4F6FC; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; font-size: 10px; fill: #B8BCD9; line-height: 1.35; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 600; fill: #E1E4F5; }
  </style>

  <g clip-path="url(#card-clip)">
    <image href="data:image/jpeg;base64," width="330" height="124" preserveAspectRatio="xMidYMid slice" />
    <rect width="330" height="124" fill="url(#card-overlay)" />
    <rect x="0.5" y="0.5" width="329" height="123" rx="14" fill="none" stroke="#4E5275" stroke-width="1" />

    <g transform="translate(18, 16)">
      <text x="0" y="8" class="idx">02 // SPATIAL INTELLIGENCE</text>
      <text x="294" y="8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#9FA5D4" text-anchor="end">↗</text>

      <text x="0" y="28" class="name">Restaurant Success Predictor</text>

      <text x="0" y="46" class="desc">Urban economic feasibility ML model with geospatial heatmap</text>
      <text x="0" y="60" class="desc">clustering and demographic viability scoring algorithms.</text>

      <g transform="translate(0, 74)">
      <rect x="0" y="0" width="46" height="18" rx="5" fill="#181A26" stroke="#484B68" stroke-width="0.8" />
      <text x="23" y="12.5" class="pill" text-anchor="middle">Python</text>
      <rect x="52" y="0" width="56" height="18" rx="5" fill="#181A26" stroke="#484B68" stroke-width="0.8" />
      <text x="80" y="12.5" class="pill" text-anchor="middle">Streamlit</text>
      <rect x="114" y="0" width="66" height="18" rx="5" fill="#181A26" stroke="#484B68" stroke-width="0.8" />
      <text x="147" y="12.5" class="pill" text-anchor="middle">scikit-learn</text>
      <rect x="186" y="0" width="46" height="18" rx="5" fill="#181A26" stroke="#484B68" stroke-width="0.8" />
      <text x="209" y="12.5" class="pill" text-anchor="middle">Folium</text>
      </g>
    </g>
  </g>
</svg>